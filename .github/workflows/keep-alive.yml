name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 9 * * 1'  # 毎週月曜9時(UTC)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s https://yzmbrfrxmjgvhqyjdgol.supabase.co/rest/v1/ \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -o /dev/null -w "%{http_code}"
